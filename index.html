  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; transform-origin: top left; }
  .card { background: #FFFFFF; border-radius: 22px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(30,10,12,.04), 0 8px 24px rgba(30,10,12,.05); min-width: 0; min-height: 0; }

  .updated { min-height: 44px; padding: 0 14px; border-radius: 12px; background: #FDF2F3; color: #9E0014; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .updated .dot { width: 8px; height: 8px; border-radius: 50%; background: #C8001A; }
  .btn-icon { width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E8DEE0; background: #FFF; color: #C8001A; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  /* KPI row */
  .kpi { flex: 0 0 150px; display: grid; grid-template-columns: 520px repeat(4, minmax(0, 1fr)); gap: 16px; }
  .hero { background: #C8001A; color: #FFF; border-radius: 22px; padding: 18px 22px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 16px; box-shadow: 0 14px 32px rgba(200,0,26,.22); }
  .hero .deco1 { position: absolute; right: -70px; top: -90px; width: 230px; height: 230px; border-radius: 50%; border: 36px solid rgba(255,255,255,.07); }
  .hero .deco2 { position: absolute; left: 30%; bottom: -140px; width: 220px; height: 220px; border-radius: 50%; background: rgba(0,0,0,.09); }
  .hero .lbl { font-size: 12px; font-weight: 700; letter-spacing: .06em; }
  .hero .big { font-size: 46px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin: 6px 0; }
  .hero .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .hero .pill-w { padding: 4px 10px; border-radius: 999px; background: #FFF; color: #C8001A; font-size: 12px; font-weight: 800; }
  .hero .pill-d { padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,.16); font-size: 12px; font-weight: 700; }
  .ring { position: relative; width: 104px; height: 104px; flex: 0 0 auto; }
  .ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .c b { font-size: 20px; letter-spacing: -0.02em; }
  .ring .c span { font-size: 10px; font-weight: 600; }
  .tile { display: flex; flex-direction: column; justify-content: space-between; }
  .tile .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tile .ico { width: 34px; height: 34px; border-radius: 11px; background: #FDECEE; color: #C8001A; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .tile .name { font-size: 13px; font-weight: 700; color: #3D3537; }
  .tile .pill { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .tile .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .tile .val { font-size: 27px; font-weight: 800; letter-spacing: -0.02em; }
  .tile .sub { font-size: 11px; color: #675E60; }
  .tile .bar { width: 100px; height: 8px; border-radius: 999px; background: #F3ECED; overflow: hidden; margin-bottom: 6px; }
  .tile .bar span { display: block; height: 100%; background: #C8001A; border-radius: 999px; }

  /* Main grid */
  .main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 980px minmax(0, 1fr); gap: 16px; }
  .left { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 16px; min-height: 0; }
  .left-bottom { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; min-height: 0; }
  .right { display: grid; grid-template-rows: 300px minmax(0, 1fr); gap: 16px; min-height: 0; min-width: 0; }
  .right-top { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; min-height: 0; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .card-head h2 { font-size: 17px; font-weight: 800; }
  .ttl { display: flex; align-items: baseline; gap: 10px; }

  /* Map */
  .map-card { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px 18px; }
  .grad-legend { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; color: #675E60; }
  .grad { width: 90px; height: 7px; border-radius: 999px; background: linear-gradient(90deg, #F6C6CD, #EE95A2, #E05468, #C8102E, #8E0019); }
  .toggle { min-height: 34px; padding: 0 12px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid #1E1A1B; background: #1E1A1B; color: #FFF; }
  .toggle.off { background: #FFF; color: #3D3537; border-color: #E5D3D6; }
  .map { position: relative; width: 100%; aspect-ratio: 1000 / 429; background: #F9F5F5; border-radius: 16px; overflow: hidden; }
  .map svg.geo { position: absolute; inset: 0; width: 100%; height: 100%; }
  .eq-lbl { position: absolute; right: 16px; transform: translateY(-130%); font-size: 11px; font-weight: 600; color: #8F8689; }
  .wdot { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; border: none; padding: 0; cursor: pointer; }
  .callout { position: absolute; min-width: 176px; background: rgba(255,255,255,.94); border: 1px solid #FFF; border-radius: 14px; padding: 9px 13px; box-shadow: 0 10px 28px rgba(80,0,10,.14); display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer; color: #1E1A1B; }
  .callout .r1 { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; font-weight: 800; }
  .callout .r1 span:last-child { color: #C8001A; }
  .callout .trk { display: block; height: 5px; border-radius: 999px; background: #2A2224; overflow: hidden; }
  .callout .trk span { display: block; height: 100%; background: #C8001A; }
  .callout .r3 { font-size: 11px; color: #675E60; font-weight: 600; }
  .kpi-legend { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 10px; align-items: center; padding: 7px 12px; border-radius: 12px; background: rgba(255,255,255,.92); box-shadow: 0 4px 14px rgba(80,0,10,.08); font-size: 11px; font-weight: 700; color: #3D3537; }
  .kpi-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

  /* Trend */
  .trend { display: flex; flex-direction: column; gap: 10px; }
  .chips { display: flex; gap: 6px; }
  .chips span { padding: 5px 10px; border-radius: 9px; font-size: 11px; font-weight: 600; }
  .legend { display: flex; gap: 14px; font-size: 11px; font-weight: 600; color: #3D3537; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .chart { flex: 1 1 auto; min-height: 0; display: flex; gap: 8px; }
  .yax { display: flex; flex-direction: column; justify-content: space-between; font-size: 10px; color: #675E60; text-align: right; min-width: 34px; padding-bottom: 22px; }

  .ticks { position: relative; height: 16px; flex: 0 0 16px; font-size: 10px; color: #675E60; }
  .ticks span { position: absolute; transform: translateX(-50%); }

  /* Top bill */
  #topbill { display: flex; flex-direction: column; gap: 8px; }
  .tb-list { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; }
  .tb { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: center; background: none; border: none; padding: 2px 0; text-align: left; cursor: pointer; color: #1E1A1B; }
  .tb .rk { width: 26px; height: 26px; border-radius: 8px; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .tb .ln { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
  .tb .ln b { font-weight: 800; }
  .tb .trk { display: block; height: 5px; border-radius: 999px; background: #F5EEEF; overflow: hidden; margin-top: 4px; }
  .tb .trk span { display: block; height: 100%; border-radius: 999px; }

  /* Pie */
  #pie { display: flex; flex-direction: column; gap: 12px; }
  .pie-body { flex: 1 1 auto; display: flex; gap: 16px; align-items: center; }
  .donut { position: relative; width: 132px; height: 132px; flex: 0 0 auto; }
  .donut .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut .c b { font-size: 19px; letter-spacing: -0.02em; }
  .donut .c span { font-size: 10px; font-weight: 600; color: #675E60; }
  .pie-list { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .pl { display: flex; align-items: center; gap: 9px; background: none; border: none; padding: 0; text-align: left; cursor: pointer; color: #1E1A1B; }
  .pl i { width: 12px; height: 12px; border-radius: 4px; flex: 0 0 auto; }
  .pl .nm { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; font-weight: 700; }
  .pl .nm small { font-size: 10px; color: #675E60; font-weight: 500; }
  .pl b { font-size: 16px; }
  .cat-strip { display: flex; gap: 4px; }
  .cat-strip span { flex: 1 1 0; height: 26px; border-radius: 8px; color: #FFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

  /* MoM bars */
  #mombars { display: flex; flex-direction: column; gap: 10px; }
  .mb-grid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; align-items: end; }
  .mb { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; padding: 0; cursor: pointer; color: #1E1A1B; min-width: 0; }
  .mb .tag { display: flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: #FDECEE; color: #C8001A; font-size: 11px; font-weight: 800; white-space: nowrap; }
  .mb .tag i { width: 6px; height: 6px; border-radius: 50%; background: #C8001A; }
  .mb .area { position: relative; display: block; width: 110px; height: 192px; }
  .mb .area svg { position: absolute; inset: 0; }
  .mb .bubble { position: absolute; left: 55px; top: 16px; transform: translate(-50%, -50%); background: #FFF; border: 1px solid #EFE4E6; border-radius: 10px; padding: 2px 8px 3px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 12px rgba(80,0,10,.08); line-height: 1.1; }
  .mb .bubble small { font-size: 8px; font-weight: 700; color: #8F8689; }
  .mb .bubble b { font-size: 13px; white-space: nowrap; }
  .mb .v { position: absolute; transform: translateX(-50%); font-size: 11px; white-space: nowrap; }
  .mb .bar { position: absolute; width: 30px; border-radius: 9px 9px 4px 4px; overflow: hidden; }
  .mb .bar::after { content: ''; position: absolute; left: -6px; top: 58%; width: 44px; height: 4px; background: #FFF; transform: rotate(-20deg); }
  .mb .xl { position: absolute; top: 176px; transform: translateX(-50%); font-size: 11px; font-weight: 600; color: #675E60; }

  /* Table */
  .table-card { display: flex; flex-direction: column; gap: 12px; }
  .seg.sm { padding: 3px; gap: 3px; border-radius: 12px; }

  .tbl { flex: 1 1 auto; min-height: 0; overflow: auto; border-radius: 14px; border: 1px solid #F1E9EA; }
  .tr { display: grid; grid-template-columns: 34px minmax(110px, 1.2fr) 96px 64px minmax(120px, 1fr) 46px 86px 86px 90px; align-items: center; }
  .th { position: sticky; top: 0; z-index: 1; background: #FAF6F6; color: #675E60; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid #F1E9EA; }
  .th > div { padding: 10px 8px; }
  .td { width: 100%; border: none; border-bottom: 1px solid #F5EFF0; padding: 0; text-align: left; cursor: pointer; font-size: 13px; color: #1E1A1B; background: #FFF; }
  .td.alt { background: #FCFAFA; }
  .td.sel { background: #FDECEE; }

  .ach { display: flex; align-items: center; gap: 8px; }

  .ach .trk span { display: block; height: 100%; border-radius: 999px; padding: 0; }
  .badge { width: 26px; height: 24px; border-radius: 999px; font-weight: 800; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
  .gp { padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }

  .btn-fs { background: #C8001A; border-color: #C8001A; color: #FFF; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: #1E1A1B; color: #FFF; padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Loading */
  #loading { position: fixed; inset: 0; background: #F6F3F3; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #675E60; z-index: 10; }
  #loading.hide { display: none; }
  .spinner { width: 36px; height: 36px; border-radius: 50%; border: 4px solid #F3D7DB; border-top-color: #C8001A; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

    renderTable(f);
    var db = $('dotBtn');
    db.textContent = 'Titik WOK: ' + (S.dots ? 'On' : 'Off');
    db.classList.toggle('off', !S.dots);
  }

  function addSeries(list) {
    var n = Math.max.apply(null, [0].concat(list.map(function (a) { return a.length; })));
    var out = [];
    for (var i = 0; i < n; i++) out.push(list.reduce(function (s, a) { return s + (a[i] || 0); }, 0));
    return out;
  }

  function renderTabs() {
    var opts = ['Semua'].concat(REG.map(function (r) { return r.name; }));
    $('tabs').innerHTML = opts.map(function (g) {
      var n = g === 'Semua' ? WOKS.length : WOKS.filter(function (w) { return w.region === g; }).length;
      return '<button type="button" class="' + (g === S.region ? 'on' : '') + '" data-act="region" data-v="' + esc(g) + '">' +
        (g === 'Semua' ? 'Semua Regional' : esc(g)) + ' <span class="chip">' + n + '</span></button>';
    }).join('');
  }

  function renderKpi(f, T, cur) {
    var dash = (Math.min(T.ach, 1) * 326.7).toFixed(1);
    var gap = T.ps >= T.tgt ? 'Surplus ' + nf(T.ps - T.tgt) + ' PS' : 'Kurang ' + nf(T.tgt - T.ps) + ' PS';
    var nA = f.filter(function (w) { return w.cat === 'A'; }).length;
    var cum = []; cur.reduce(function (s, v) { s += v; cum.push(s); return s; }, 0);
    var sMom = spark(cur, 120, 36), sCum = spark(cum, 120, 36);
    var maxBill = Math.max.apply(null, [1].concat(WOKS.map(function (w) { return w.bill; })));

    var hero =
      '<div class="hero"><div class="deco1"></div><div class="deco2"></div>' +
      '<div style="position:relative"><div class="lbl">TOTAL PS · ' + esc(DATA.periodLabel.toUpperCase()) + '</div>' +
      '<div class="big">' + nf(T.ps) + '</div>' +
      '<div class="pills"><span class="pill-w">KPI ' + T.cat.k + ' · ' + T.cat.name + '</span>' +
      '<span class="pill-d">Target ' + nf(T.tgt) + ' · ' + gap + '</span></div></div>' +
      '<div class="ring"><svg width="104" height="104" viewBox="0 0 132 132" role="img" aria-label="Achievement ' + p1(T.ach * 100) + '%">' +
      '<circle cx="66" cy="66" r="52" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="13"></circle>' +
      '<circle cx="66" cy="66" r="52" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-dasharray="' + dash + ' 326.7" transform="rotate(-90 66 66)"></circle></svg>' +
      '<div class="c"><b>' + p1(T.ach * 100) + '%</b><span>achievement</span></div></div></div>';

    var tiles = [
      { name: 'Growth MoM', icon: ICON.trend, val: (T.mom >= 0 ? '+' : '') + p1(T.mom) + '%', valC: upC(T.mom), pill: T.mom >= 0 ? '▲ Naik' : '▼ Turun', pBg: upBg(T.mom), pFg: upC(T.mom), sub: 'vs ' + DATA.prevShort + ' · ' + nf(T.prev) + ' PS', spark: sMom },
      { name: 'Growth YoY', icon: ICON.cal, val: (T.yoy >= 0 ? '+' : '') + p1(T.yoy) + '%', valC: upC(T.yoy), pill: T.yoy >= 0 ? '▲ Naik' : '▼ Turun', pBg: upBg(T.yoy), pFg: upC(T.yoy), sub: 'vs ' + DATA.lyShort + ' · ' + nf(T.ly) + ' PS', spark: sCum },
      { name: 'Rata-rata Tagihan', icon: ICON.wallet, val: 'Rp ' + nf(T.bill), valC: '#1E1A1B', pill: nf(T.subs) + ' plg', pBg: '#F3EDEE', pFg: '#3D3537', sub: 'per pelanggan / bulan', bar: T.bill / maxBill * 100 },
      { name: 'WOK Capai Target', icon: ICON.target, val: nA + ' / ' + f.length, valC: '#1E1A1B', pill: p1(f.length ? nA / f.length * 100 : 0) + '%', pBg: '#E6F4EC', pFg: '#14663A', sub: 'WOK KPI A (≥ 100%)', bar: f.length ? nA / f.length * 100 : 0 }
    ];
    $('kpi').innerHTML = hero + tiles.map(function (k) {
      var right = k.spark
        ? '<svg width="100" height="36" viewBox="0 0 120 36" preserveAspectRatio="none" aria-hidden="true"><path d="' + k.spark.area + '" fill="#C8001A" fill-opacity="0.08"></path><path d="' + k.spark.d + '" fill="none" stroke="#C8001A" stroke-width="2" vector-effect="non-scaling-stroke"></path></svg>'
        : '<div class="bar"><span style="width:' + Math.min(k.bar, 100).toFixed(1) + '%"></span></div>';
      return '<div class="card tile"><div class="top"><span style="display:flex;align-items:center;gap:10px"><span class="ico">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + k.icon + '"></path></svg></span>' +
        '<span class="name">' + k.name + '</span></span><span class="pill" style="background:' + k.pBg + ';color:' + k.pFg + '">' + k.pill + '</span></div>' +
        '<div class="bottom"><div><div class="val" style="color:' + k.valC + '">' + k.val + '</div><div class="sub">' + esc(k.sub) + '</div></div>' + right + '</div></div>';
    }).join('');
  }

  function renderMap(region) {
    var fills = {}, cards = '';
    REG.forEach(function (r) {
      var ws = WOKS.filter(function (w) { return w.region === r.name; });
      var rps = sum(ws, 'ps'), rt = sum(ws, 'target'), a = rt ? rps / rt : 0;
      var on = region === 'Semua' || region === r.name;
      fills[r.key] = on ? shade(a) : '#EFE3E5';
      cards += '<button type="button" class="callout" data-act="regionToggle" data-v="' + esc(r.name) + '" style="left:' + r.card[0] + '%;top:' + r.card[1] + '%;opacity:' + (on ? 1 : 0.5) + '">' +
        '<span class="r1"><span>' + r.name + '</span><span>' + p1(a * 100) + '%</span></span>' +
        '<span class="trk"><span style="width:' + Math.min(a * 100, 100).toFixed(1) + '%"></span></span>' +
        '<span class="r3">' + ws.length + ' WOK · ' + nf(rps) + ' PS</span></button>';
    });
    var eqY = Y(0);
    var svg = '<svg class="geo" viewBox="0 0 1000 429" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' +
      '<line x1="0" y1="' + eqY.toFixed(1) + '" x2="1000" y2="' + eqY.toFixed(1) + '" stroke="#D3C4C7" stroke-width="1" stroke-dasharray="4 5"></line>' +
      '<path d="' + MAP_PATHS.ctx + '" fill="#E4DEDF" stroke="#FFFFFF" stroke-width="0.5"></path>' +
      REG.map(function (r) { return '<path d="' + MAP_PATHS[r.key] + '" fill="' + fills[r.key] + '" stroke="#FFFFFF" stroke-width="0.8"></path>'; }).join('') +
      REG.map(function (r) {
        var ax = X(r.anchor[0]).toFixed(1), ay = Y(r.anchor[1]).toFixed(1);
        return '<line x1="' + ax + '" y1="' + ay + '" x2="' + r.end[0] + '" y2="' + r.end[1] + '" stroke="#3D3537" stroke-width="1"></line>' +
          '<circle cx="' + ax + '" cy="' + ay + '" r="5" fill="#FFFFFF" stroke="#3D3537" stroke-width="2"></circle>';
      }).join('') + '</svg>';
    var maxPs = Math.max.apply(null, [1].concat(WOKS.map(function (w) { return w.ps; })));
    var dots = !S.dots ? '' : WOKS.filter(function (w) { return w.x || w.y; }).map(function (w) {
      var on = region === 'Semua' || w.region === region, sel = w.name === S.sel, sz = Math.round(9 + w.ps / maxPs * 7);
      var lbl = w.name + ' – KPI ' + w.cat + ', achievement ' + p1(w.ach * 100) + '%';
      return '<button type="button" class="wdot" data-act="sel" data-v="' + esc(w.name) + '" aria-label="' + esc(lbl) + '" title="' + esc(lbl) + '" style="left:' +
        (w.x / 10).toFixed(2) + '%;top:' + (w.y / 4.29).toFixed(2) + '%;width:' + sz + 'px;height:' + sz + 'px;background:' + w.color +
        ';opacity:' + (on ? 1 : 0.2) + ';box-shadow:' + (sel ? '0 0 0 3px #FFF,0 0 0 6px #1E1A1B' : '0 0 0 2px #FFF,0 2px 6px rgba(80,0,10,.25)') + '"></button>';
    }).join('');
    var legend = '<div class="kpi-legend">KPI WOK ' + CATS.map(function (c) { return '<span><i style="background:' + c.color + '"></i>' + c.k + '</span>'; }).join('') + '</div>';
    $('map').innerHTML = svg + '<div class="eq-lbl" style="top:' + (eqY / 4.29).toFixed(2) + '%">Khatulistiwa 0°</div>' + dots + cards + legend;
  }

  function renderTrend(T, cur, prev, region) {
    var n = Math.max(cur.length, prev.length, 2), denom = n - 1;
    var tDay = T.tgt / Math.max(prev.length, cur.length, 1);
    var mx = Math.max.apply(null, cur.concat(prev, [tDay, 1])) * 1.15;
    var pt = function (v, i) { return [i / denom * 600, 220 - v / mx * 220]; };
    var curD = smooth(cur.map(pt)), prevD = smooth(prev.map(pt));
    var lastX = cur.length ? ((cur.length - 1) / denom * 600).toFixed(1) : 0;
    var area = curD ? curD + ' L' + lastX + ',220 L0,220 Z' : '';
    var peak = cur.length ? cur.indexOf(Math.max.apply(null, cur)) : 0;
    var avg = cur.length ? sum(cur) / cur.length : 0;
    var tY = (220 - tDay / mx * 220).toFixed(1);
    var ticks = [1, 5, 10, 15, 20, 25, n].filter(function (d, i, a) { return d <= n && a.indexOf(d) === i; });
    $('trend').innerHTML =
      '<div class="card-head"><h2>Trend Penjualan Harian</h2><div class="chips">' +
      '<span style="background:#F7F2F3;color:#3D3537">Avg <b>' + nf(avg) + '</b>/hari</span>' +
      '<span style="background:#FDECEE;color:#9E0014">Puncak tgl ' + (peak + 1) + ' · <b>' + nf(cur[peak] || 0) + '</b></span></div></div>' +
      '<div class="legend"><span><i style="width:16px;height:3px;border-radius:2px;background:#C8001A;display:inline-block"></i>' + esc(DATA.curShort) + '</span>' +
      '<span><i style="width:16px;border-top:2px dashed #8F8689;display:inline-block"></i>' + esc(DATA.prevShort) + '</span>' +
      '<span><i style="width:16px;border-top:2px dotted #1E1A1B;display:inline-block"></i>Target harian</span>' +
      '<span style="color:#675E60">' + (region === 'Semua' ? 'Semua regional' : esc(region)) + '</span></div>' +
      '<div class="chart"><div class="yax"><span>' + nf(mx) + '</span><span>' + nf(mx / 2) + '</span><span>0</span></div>' +
      '<div class="plot"><svg viewBox="0 0 600 220" preserveAspectRatio="none" role="img" aria-label="Trend penjualan harian">' +
      '<line x1="0" y1="0.5" x2="600" y2="0.5" stroke="#F3ECED" vector-effect="non-scaling-stroke"></line>' +
      '<line x1="0" y1="110" x2="600" y2="110" stroke="#F3ECED" vector-effect="non-scaling-stroke"></line>' +
      '<line x1="0" y1="219.5" x2="600" y2="219.5" stroke="#E8DCDE" vector-effect="non-scaling-stroke"></line>' +
      '<path d="' + area + '" fill="#C8001A" fill-opacity="0.08"></path>' +
      '<path d="' + prevD + '" fill="none" stroke="#8F8689" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"></path>' +
      '<line x1="0" y1="' + tY + '" x2="600" y2="' + tY + '" stroke="#1E1A1B" stroke-width="1.5" stroke-dasharray="2 4" vector-effect="non-scaling-stroke"></line>' +
      '<path d="' + curD + '" fill="none" stroke="#C8001A" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg>' +
      '<div class="ticks">' + ticks.map(function (d) { return '<span style="left:' + ((d - 1) / denom * 100).toFixed(2) + '%">' + d + '</span>'; }).join('') + '</div></div></div>';
  }

  function renderTopBill(f) {
    var top = f.slice().sort(function (a, b) { return b.bill - a.bill; }).slice(0, 6);
    var mx = top.length ? top[0].bill : 1;
    $('topbill').innerHTML = '<div class="card-head"><h2>Tagihan Tertinggi</h2><span class="muted" style="font-size:11px">rata-rata / plg</span></div>' +
      '<div class="tb-list">' + top.map(function (w, i) {
        var hi = i < 3;
        return '<button type="button" class="tb" data-act="sel" data-v="' + esc(w.name) + '"><span class="rk" style="background:' + (hi ? '#C8001A' : '#F4EEEF') + ';color:' + (hi ? '#FFF' : '#675E60') + '">' + (i + 1) + '</span>' +
          '<span><span class="ln"><span>' + esc(w.name) + '</span><b>Rp ' + nf(w.bill / 1000) + 'rb</b></span>' +
          '<span class="trk"><span style="width:' + (w.bill / mx * 100).toFixed(1) + '%;background:' + (hi ? '#C8001A' : '#E9919C') + '"></span></span></span></button>';
      }).join('') + '</div>';
  }

  function renderPie(region, f) {
    var all = sum(WOKS, 'ps') || 1, C = 339.3, cum = 0, circles = '', list = '';
    REG.forEach(function (r) {
      var ws = WOKS.filter(function (w) { return w.region === r.name; });
      var ps = sum(ws, 'ps'), frac = ps / all, on = region === 'Semua' || region === r.name;
      circles += '<circle cx="70" cy="70" r="54" fill="none" stroke="' + r.color + '" stroke-opacity="' + (on ? 1 : 0.25) + '" stroke-width="20" stroke-dasharray="' +
        Math.max(frac * C - 2, 0).toFixed(1) + ' ' + C + '" stroke-dashoffset="' + (-cum * C).toFixed(1) + '" transform="rotate(-90 70 70)"></circle>';
      cum += frac;
      list += '<button type="button" class="pl" data-act="regionToggle" data-v="' + esc(r.name) + '" style="opacity:' + (on ? 1 : 0.45) + '"><i style="background:' + r.color + '"></i>' +
        '<span class="nm">' + r.name + '<small>' + nf(ps) + ' PS · ' + ws.length + ' WOK</small></span><b>' + p1(frac * 100) + '%</b></button>';
    });
    var cats = CATS.map(function (c) { return '<span style="background:' + c.color + '">' + c.k + ' · ' + f.filter(function (w) { return w.cat === c.k; }).length + '</span>'; }).join('');
    $('pie').innerHTML = '<div class="card-head"><h2>Kontribusi PS per Regional</h2><span class="muted" style="font-size:11px">' + esc(DATA.curShort) + '</span></div>' +
      '<div class="pie-body"><div class="donut"><svg width="132" height="132" viewBox="0 0 140 140" role="img" aria-label="Kontribusi PS per regional">' +
      '<circle cx="70" cy="70" r="54" fill="none" stroke="#F3EDEE" stroke-width="20"></circle>' + circles + '</svg>' +
      '<div class="c"><b>' + nf(all) + '</b><span>Total PS</span></div></div><div class="pie-list">' + list + '</div></div>' +
      '<div><div class="muted" style="font-size:11px;font-weight:700;margin-bottom:6px">Kategori KPI WOK · ' + (region === 'Semua' ? 'Semua regional' : esc(region)) + '</div><div class="cat-strip">' + cats + '</div></div>';
  }

  function renderMomBars(region) {
    var agg = REG.map(function (r) {
      var ws = WOKS.filter(function (w) { return w.region === r.name; });
      return { name: r.name, cur: sum(ws, 'ps'), prev: sum(ws, 'psPrev') };
    });
    var mx = Math.max.apply(null, [1].concat(agg.map(function (a) { return Math.max(a.cur, a.prev); })));
    var curLbl = DATA.curShort.split(' ')[0], prevLbl = DATA.prevShort.split(' ')[0];
    $('mombars').innerHTML = '<div class="card-head"><h2>MoM Actual PS</h2><div class="legend">' +
      '<span><i style="width:10px;height:10px;border-radius:3px;background:#D9D3D5;display:inline-block"></i>' + esc(prevLbl) + '</span>' +
      '<span><i style="width:10px;height:10px;border-radius:3px;background:#C8001A;display:inline-block"></i>' + esc(curLbl) + '</span></div></div>' +
      '<div class="mb-grid">' + agg.map(function (a) {
        var mv = pct(a.cur, a.prev), on = region === 'Semua' || region === a.name;
        var pH = Math.round(a.prev / mx * 100), cH = Math.round(a.cur / mx * 100);
        var pT = 172 - pH, cT = 172 - cH, pL = pT - 16, cL = cT - 16;
        return '<button type="button" class="mb" data-act="regionToggle" data-v="' + esc(a.name) + '" style="opacity:' + (on ? 1 : 0.4) + '" aria-label="' +
          esc(a.name + ': ' + prevLbl + ' ' + nf(a.prev) + ', ' + curLbl + ' ' + nf(a.cur) + ', MoM ' + p1(mv) + '%') + '">' +
          '<span class="tag"><i></i>' + a.name + '</span><span class="area">' +
          '<svg width="110" height="192" viewBox="0 0 110 192" aria-hidden="true"><path d="M25,' + (pL - 4) + ' V22 Q25,16 31,16 H79 Q85,16 85,22 V' + (cL - 9) +
          '" fill="none" stroke="#A39A9C" stroke-width="1.3" stroke-linecap="round"></path><path d="M81,' + (cL - 9) + ' L89,' + (cL - 9) + ' L85,' + (cL - 3) + ' Z" fill="#A39A9C"></path></svg>' +
          '<span class="bubble"><small>MoM</small><b style="color:' + upC(mv) + '">' + (mv >= 0 ? '+' : '') + p1(mv) + '%</b></span>' +
          '<span class="v" style="left:25px;top:' + pL + 'px;color:#675E60;font-weight:700">' + nf(a.prev) + '</span>' +
          '<span class="v" style="left:85px;top:' + cL + 'px;font-weight:800">' + nf(a.cur) + '</span>' +
          '<span class="bar" style="left:10px;top:' + pT + 'px;height:' + pH + 'px;background:#D9D3D5"></span>' +
          '<span class="bar" style="left:70px;top:' + cT + 'px;height:' + cH + 'px;background:#C8001A"></span>' +
          '<span class="xl" style="left:25px">' + esc(prevLbl) + '</span><span class="xl" style="left:85px">' + esc(curLbl) + '</span></span></button>';
      }).join('') + '</div>';
  }

  function renderTable(f) {
    var sorts = [['ach', 'Achievement'], ['mom', 'MoM'], ['yoy', 'YoY'], ['bill', 'Tagihan'], ['ps', 'PS']];
    var rows = f.slice().sort(function (a, b) { return b[S.sort] - a[S.sort]; });
    $('table').innerHTML =
      '<div class="card-head"><div style="display:flex;flex-direction:column"><h2>Performance per WOK</h2><span class="muted" style="font-size:11px">' +
      rows.length + ' WOK · MoM vs ' + esc(DATA.prevShort) + ' · YoY vs ' + esc(DATA.lyShort) + '</span></div>' +
      '<div class="seg sm">' + sorts.map(function (s) {
        return '<button type="button" class="' + (S.sort === s[0] ? 'on' : '') + '" data-act="sort" data-v="' + s[0] + '">' + s[1] + '</button>';
      }).join('') + '</div></div>' +
      '<div class="tbl"><div class="tr th"><div style="padding-left:12px">#</div><div>WOK</div><div>Regional</div><div class="r">PS</div><div>Achievement</div><div style="text-align:center">KPI</div><div class="r">MoM</div><div class="r">YoY</div><div class="r" style="padding-right:12px">Tagihan</div></div>' +
      rows.map(function (w, i) {
        var t = TINT[w.cat];
        return '<button type="button" class="tr td' + (w.name === S.sel ? ' sel' : (i % 2 ? ' alt' : '')) + '" data-act="sel" data-v="' + esc(w.name) + '">' +
          '<span style="padding-left:12px;font-weight:700;color:#8F8689;font-size:12px">' + (i + 1) + '</span>' +
          '<span style="font-weight:700">' + esc(w.name) + '</span>' +
          '<span style="color:#675E60;font-size:12px;white-space:nowrap">' + esc(w.region) + '</span>' +
          '<span class="r" style="font-weight:700">' + nf(w.ps) + '</span>' +
          '<span class="ach"><span class="trk"><span style="width:' + Math.min(w.ach * 100 / 1.1, 100).toFixed(1) + '%;background:' + w.color + '"></span></span><b style="font-size:12px;min-width:46px;text-align:right">' + p1(w.ach * 100) + '%</b></span>' +
          '<span style="text-align:center"><span class="badge" style="background:' + t[0] + ';color:' + t[1] + '">' + w.cat + '</span></span>' +
          '<span class="r"><span class="gp" style="background:' + upBg(w.mom) + ';color:' + upC(w.mom) + '">' + sgn(w.mom) + '</span></span>' +
          '<span class="r"><span class="gp" style="background:' + upBg(w.yoy) + ';color:' + upC(w.yoy) + '">' + sgn(w.yoy) + '</span></span>' +
          '<span class="r" style="padding-right:12px;font-weight:700;font-size:12px">Rp ' + nf(w.bill / 1000) + 'rb</span></button>';
      }).join('') + '</div>';
  }

  // ---------- interaction ----------
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    if (act === 'region') S.region = v;
    else if (act === 'regionToggle') S.region = S.region === v ? 'Semua' : v;
    else if (act === 'sort') S.sort = v;
    else if (act === 'sel') S.sel = S.sel === v ? null : v;
    else if (act === 'dots') S.dots = !S.dots;
    else if (act === 'refresh') { load(); return; }
    else if (act === 'fullscreen') { toggleFullscreen(); return; }
    render();
  });

  load();
  
})();
</script>

</body>
</html>
